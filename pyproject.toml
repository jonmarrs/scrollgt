[project]
name = "scrollgt"
version = "0.1.0"
description = "ScrollGT: registered human ground-truth ink evaluation for the open Vesuvius Challenge SOTA scroll data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
scrollgt = "scrollgt.cli:main"

[project.urls]
Homepage = "https://github.com/jonmarrs/scrollgt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrollgt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `heavy` is opt-in: reproducing a 512 fiber cube's floors costs ~70 s and ~8 GB peak
# RSS. One 512 cube runs by default so both size classes stay covered (see
# tests/test_fiber_target.py::FLOOR_TARGETS); the other two are deselected here and run
# with `pytest -m heavy`, which wins because a command-line -m overrides addopts.
addopts = ["-m", "not heavy"]
markers = [
    "heavy: multi-GB, minute-scale reproduction of a 512 cube's floors; opt in with -m heavy",
]
