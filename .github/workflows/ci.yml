name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      # Runs the default selection: everything except the `heavy` marker, which is two of
      # the three 512-cube floor reproductions (~70 s and ~8 GB peak RSS each). The third
      # 512 cube and all eight 256 cubes DO run here, so the no-GPU reproduction guarantee
      # is exercised on both size classes on every push. See CONTRIBUTING.md ("The `heavy`
      # marker") and the FLOOR_TARGETS comment in tests/test_fiber_target.py.
      - name: Run tests
        run: pytest -q
      - name: Smoke the CLI against a shipped target (constant predictor)
        run: |
          python - <<'PY'
          import numpy as np
          from PIL import Image
          from scrollgt.score import load_target
          gt, _, _ = load_target("data/scroll1_20231210121321")
          Image.fromarray(np.full(gt.shape, 128, "uint8")).save("pred.png")
          PY
          scrollgt score pred.png data/scroll1_20231210121321
          scrollgt check --window-px 64 --scan-um 8.0
      - name: Smoke score-columns on the PHerc-1667 column target (constant, cols 5-8)
        run: |
          python - <<'PY'
          import json
          import numpy as np
          cols = json.load(open("data/pherc1667_merged_columns/columns.json"))["columns"]
          sel = [c for c in cols if 5 <= c["col"] <= 8]  # contiguous single-strip text cols
          y0 = min(c["text_band"][0] for c in sel)
          y1 = max(c["text_band"][1] for c in sel)
          x0 = min(c["gx0"] for c in sel)
          x1 = max(c["gx1"] for c in sel)
          np.save("colpred.npy", np.full((y1 - y0, x1 - x0), 0.5, np.float32))
          with open("origin.txt", "w") as f:
              f.write(f"{y0} {x0}")
          PY
          scrollgt score-columns colpred.npy data/pherc1667_merged_columns --origin $(cat origin.txt)
      - name: Smoke score-fibers on a shipped cube (connected-components labelling)
        run: |
          python - <<'PY'
          import numpy as np
          from scrollgt.fibers import floor_connected_components
          from scrollgt.fibers.target import load_fiber_target
          _, mask, _ = load_fiber_target("data/fibers_s1_00497_01497_03997_256")
          np.save("fibpred.npy", floor_connected_components(mask).astype(np.int32))
          PY
          scrollgt score-fibers fibpred.npy data/fibers_s1_00497_01497_03997_256
